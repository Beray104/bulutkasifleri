spring.application.name=social-media-analysis

spring.datasource.url=jdbc:h2:mem:social_media_analysis;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.elasticsearch.uris=http://localhost:9200
spring.data.elasticsearch.repositories.enabled=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=social-media-analysis-test-group
spring.kafka.listener.auto-startup=false

app.spark.enabled=false

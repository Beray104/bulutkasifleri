spring.application.name=social-media-analysis

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=SosyalMedyaAnaliz;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=social-media-analysis-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eren.social_media_analysis.dto
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.spark.enabled=true
app.spark.app-name=social-media-analysis-streaming
app.spark.master=local[*]
app.spark.kafka-bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.spark.kafka-topic=social-media-topic
app.spark.elasticsearch-nodes=${SPRING_ELASTICSEARCH_HOST:localhost}
app.spark.elasticsearch-port=${SPRING_ELASTICSEARCH_PORT:9200}
app.spark.elasticsearch-index=social_media_analytics
app.spark.checkpoint-location=target/spark-checkpoints/social-media-analytics
